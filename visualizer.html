<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenomeDiff — Hilbert Curve Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 20px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #f0f6fc;
  }

  #subtitle {
    font-size: 0.85rem;
    color: #8b949e;
    text-align: center;
    max-width: 640px;
  }

  /* ── Controls ─────────────────────────────────────────────────────────── */
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }

  label { font-size: 0.8rem; color: #8b949e; }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  input[type="file"],
  input[type="range"],
  select {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    padding: 4px 8px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  input[type="color"] {
    width: 36px;
    height: 28px;
    padding: 2px;
    border-radius: 4px;
    border: 1px solid #30363d;
    background: #161b22;
    cursor: pointer;
  }

  .color-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .color-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: #8b949e;
  }

  button {
    background: #238636;
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    padding: 7px 16px;
    transition: background 0.15s;
  }
  button:hover { background: #2ea043; }
  button.secondary {
    background: #21262d;
    border: 1px solid #30363d;
  }
  button.secondary:hover { background: #30363d; }

  /* ── Canvas wrapper ───────────────────────────────────────────────────── */
  #canvas-wrap {
    position: relative;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    cursor: crosshair;
  }

  canvas { display: block; }

  /* ── Tooltip ──────────────────────────────────────────────────────────── */
  #tooltip {
    position: fixed;
    background: rgba(13,17,23,0.92);
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.75rem;
    line-height: 1.6;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    max-width: 240px;
  }
  #tooltip.visible { opacity: 1; }

  /* ── Stats bar ────────────────────────────────────────────────────────── */
  #stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.78rem;
    color: #8b949e;
  }
  .stat-item strong { color: #e6edf3; }

  /* ── Progress overlay ─────────────────────────────────────────────────── */
  #progress {
    font-size: 0.82rem;
    color: #8b949e;
    height: 20px;
  }

  #drop-zone {
    border: 2px dashed #30363d;
    border-radius: 10px;
    padding: 32px 48px;
    text-align: center;
    color: #8b949e;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    min-width: 320px;
  }
  #drop-zone.drag-over { border-color: #58a6ff; color: #58a6ff; }
  #drop-zone.hidden { display: none; }
</style>
</head>
<body>

<h1>GenomeDiff — Hilbert Curve Visualizer</h1>
<p id="subtitle">Load a JSON produced by <code>fetch_align.py</code> to render the alignment as a space-filling Hilbert curve.</p>

<!-- ── File drop zone ──────────────────────────────────────────────────────── -->
<div id="drop-zone">
  <div>Drop <strong>*.json</strong> here or click to browse</div>
  <div style="margin-top:8px;font-size:0.75rem">Generated by fetch_align.py</div>
  <input type="file" id="file-input" accept=".json" style="display:none">
</div>

<!-- ── Controls (hidden until data loaded) ────────────────────────────────── -->
<div id="controls" style="display:none">
  <div class="ctrl-group">
    <label>Hilbert order (resolution)</label>
    <select id="order-select">
      <option value="6">Order 6  — 64×64 = 4096 cells</option>
      <option value="7" selected>Order 7  — 128×128 = 16 384 cells</option>
      <option value="8">Order 8  — 256×256 = 65 536 cells</option>
      <option value="9">Order 9  — 512×512 = 262 144 cells</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Canvas size (px)</label>
    <select id="size-select">
      <option value="512">512</option>
      <option value="800">800</option>
      <option value="1024" selected>1024</option>
      <option value="2048">2048 (print)</option>
      <option value="4096">4096 (hi-res print)</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Background</label>
    <input type="color" id="bg-color" value="#0d1117">
  </div>

  <div class="color-row">
    <div class="color-item">
      <input type="color" id="match-color" value="#2196F3">
      <span>Match</span>
    </div>
    <div class="color-item">
      <input type="color" id="mismatch-color" value="#FF5722">
      <span>Mismatch</span>
    </div>
    <div class="color-item">
      <input type="color" id="gap-color" value="#9E9E9E">
      <span>Gap</span>
    </div>
  </div>

  <button id="render-btn">Re-render</button>
  <button id="export-btn" class="secondary">Export PNG</button>
  <button id="load-btn" class="secondary">Load different file</button>
</div>

<div id="progress"></div>

<!-- ── Canvas ──────────────────────────────────────────────────────────────── -->
<div id="canvas-wrap" style="display:none">
  <canvas id="main-canvas"></canvas>
</div>

<!-- ── Stats ───────────────────────────────────────────────────────────────── -->
<div id="stats"></div>

<!-- ── Tooltip ─────────────────────────────────────────────────────────────── -->
<div id="tooltip"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Hilbert curve utilities
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Convert 1-D index d → (x, y) for a Hilbert curve of order `order`.
 * The grid is (2^order) × (2^order).
 */
function hilbertD2XY(order, d) {
  let x = 0, y = 0;
  for (let s = 1; s < (1 << order); s <<= 1) {
    const rx = (d >> 1) & 1;
    const ry = (d ^ rx) & 1;
    // rotate
    if (ry === 0) {
      if (rx === 1) { x = s - 1 - x; y = s - 1 - y; }
      [x, y] = [y, x];
    }
    x += s * rx;
    y += s * ry;
    d >>= 2;
  }
  return [x, y];
}

/**
 * Pre-compute all (x, y) pairs for a given order.
 * Returns a Float32Array of length 2 * (2^order)^2.
 */
function buildHilbertLUT(order) {
  const n = 1 << order;           // cells per side
  const total = n * n;
  const lut = new Int32Array(total * 2);
  for (let d = 0; d < total; d++) {
    const [x, y] = hilbertD2XY(order, d);
    lut[d * 2]     = x;
    lut[d * 2 + 1] = y;
  }
  return lut;
}

// ─────────────────────────────────────────────────────────────────────────────
// Hex colour → [r, g, b]
// ─────────────────────────────────────────────────────────────────────────────
function hexToRGB(hex) {
  const v = parseInt(hex.replace("#", ""), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

// ─────────────────────────────────────────────────────────────────────────────
// Core renderer
// ─────────────────────────────────────────────────────────────────────────────

let currentData = null;  // loaded JSON
let lut = null;          // Hilbert LUT for current order
let lastOrder = -1;

async function render() {
  if (!currentData) return;

  const order     = parseInt(document.getElementById("order-select").value);
  const canvasSize = parseInt(document.getElementById("size-select").value);
  const bgHex     = document.getElementById("bg-color").value;
  const matchHex  = document.getElementById("match-color").value;
  const mmHex     = document.getElementById("mismatch-color").value;
  const gapHex    = document.getElementById("gap-color").value;

  const n = 1 << order;     // grid cells per side
  const total = n * n;
  const cellPx = canvasSize / n;  // pixels per cell (may be < 1)

  setProgress("Building Hilbert LUT…");

  // Rebuild LUT only when order changes
  if (order !== lastOrder) {
    await yieldFrame();
    lut = buildHilbertLUT(order);
    lastOrder = order;
  }

  setProgress("Painting canvas…");
  await yieldFrame();

  const canvas = document.getElementById("main-canvas");
  canvas.width  = canvasSize;
  canvas.height = canvasSize;

  // Clamp display size to viewport
  const maxDisplay = Math.min(window.innerWidth - 32, 900);
  canvas.style.width  = Math.min(canvasSize, maxDisplay) + "px";
  canvas.style.height = Math.min(canvasSize, maxDisplay) + "px";

  const ctx = canvas.getContext("2d");

  // ── Fill background ──────────────────────────────────────────────────────
  ctx.fillStyle = bgHex;
  ctx.fillRect(0, 0, canvasSize, canvasSize);

  // ── Prepare ImageData for pixel-level painting ───────────────────────────
  // For cellPx >= 1 we use ImageData for speed; otherwise fall through rects.
  const useImageData = cellPx >= 1;
  const imgData = useImageData ? ctx.createImageData(canvasSize, canvasSize) : null;
  const px = useImageData ? imgData.data : null;

  const [bgR, bgG, bgB]   = hexToRGB(bgHex);
  const [mR, mG, mB]      = hexToRGB(matchHex);
  const [mmR, mmG, mmB]   = hexToRGB(mmHex);
  const [gR, gG, gB]      = hexToRGB(gapHex);

  const positions = currentData.positions;
  const posLen    = positions.length;

  // Each Hilbert cell covers multiple alignment positions when posLen > total,
  // or one position per cell (with empty cells) when posLen <= total.
  const stride = Math.max(1, Math.ceil(posLen / total));

  let drawnCells = 0;
  const CHUNK = 4096;

  for (let cell = 0; cell < total; cell++) {
    // ── Gather type for this cell (majority vote over stride positions) ────
    let nMatch = 0, nMismatch = 0, nGap = 0;
    const start = cell * stride;
    const end   = Math.min(start + stride, posLen);

    for (let i = start; i < end; i++) {
      const t = positions[i].type;
      if      (t === "match")    nMatch++;
      else if (t === "mismatch") nMismatch++;
      else                       nGap++;
    }

    // Empty cell (sequence shorter than grid)
    if (nMatch + nMismatch + nGap === 0) {
      drawnCells++;
      if (drawnCells % CHUNK === 0) await yieldFrame();
      continue;
    }

    // Dominant type
    let r, g, b;
    if (nMismatch >= nGap && nMismatch >= nMatch) {
      [r, g, b] = [mmR, mmG, mmB];
    } else if (nGap >= nMatch) {
      [r, g, b] = [gR, gG, gB];
    } else {
      [r, g, b] = [mR, mG, mB];
    }

    // Intensity: proportion of the dominant type → brightness variation
    const total_in_cell = nMatch + nMismatch + nGap;
    const alpha = 0.4 + 0.6 * (Math.max(nMatch, nMismatch, nGap) / total_in_cell);

    // ── Map cell index to (x, y) via LUT ──────────────────────────────────
    const gx = lut[cell * 2];
    const gy = lut[cell * 2 + 1];

    if (useImageData) {
      // Paint a cellPx × cellPx block into ImageData
      const cpx = Math.max(1, Math.round(cellPx));
      const px0 = Math.round(gx * cellPx);
      const py0 = Math.round(gy * cellPx);
      for (let dy = 0; dy < cpx && py0 + dy < canvasSize; dy++) {
        for (let dx = 0; dx < cpx && px0 + dx < canvasSize; dx++) {
          const idx = ((py0 + dy) * canvasSize + (px0 + dx)) * 4;
          // Blend over background
          const a = alpha;
          px[idx]     = Math.round(bgR * (1 - a) + r * a);
          px[idx + 1] = Math.round(bgG * (1 - a) + g * a);
          px[idx + 2] = Math.round(bgB * (1 - a) + b * a);
          px[idx + 3] = 255;
        }
      }
    } else {
      // Sub-pixel: draw a rect
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fillRect(gx * cellPx, gy * cellPx, cellPx, cellPx);
    }

    drawnCells++;
    if (drawnCells % CHUNK === 0) await yieldFrame();
  }

  if (useImageData) {
    ctx.putImageData(imgData, 0, 0);
  }

  // ── Legend overlay ────────────────────────────────────────────────────────
  drawLegend(ctx, canvasSize, matchHex, mmHex, gapHex,
             currentData.meta, bgHex);

  setProgress("");
  document.getElementById("canvas-wrap").style.display = "block";
}

function drawLegend(ctx, size, matchHex, mmHex, gapHex, meta, bgHex) {
  const pad   = Math.round(size * 0.018);
  const swatch = Math.round(size * 0.02);
  const fontSize = Math.max(10, Math.round(size * 0.016));
  const lineH = swatch + Math.round(size * 0.006);

  const items = [
    { color: matchHex,  label: `Match  ${meta.stats.match.toLocaleString()}` },
    { color: mmHex,     label: `Mismatch  ${meta.stats.mismatch.toLocaleString()}` },
    { color: gapHex,    label: `Gap  ${meta.stats.gap.toLocaleString()}` },
  ];

  const boxW = Math.round(size * 0.28);
  const boxH = pad * 2 + items.length * lineH + Math.round(size * 0.02);
  const x0 = size - boxW - pad;
  const y0 = size - boxH - pad;

  // Background panel
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.beginPath();
  ctx.roundRect(x0, y0, boxW, boxH, 6);
  ctx.fill();

  // Title
  ctx.fillStyle = "#e6edf3";
  ctx.font = `600 ${fontSize}px sans-serif`;
  ctx.fillText(meta.label, x0 + pad, y0 + pad + fontSize);

  // Species
  ctx.font = `${Math.round(fontSize * 0.82)}px sans-serif`;
  ctx.fillStyle = "#8b949e";
  ctx.fillText(
    `${meta.species_a.name} vs ${meta.species_b.name}`,
    x0 + pad,
    y0 + pad + fontSize * 2.0
  );

  // Swatches
  items.forEach((item, i) => {
    const rowY = y0 + pad + fontSize * 2.8 + i * lineH;
    ctx.fillStyle = item.color;
    ctx.fillRect(x0 + pad, rowY, swatch, swatch);
    ctx.fillStyle = "#e6edf3";
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillText(item.label, x0 + pad + swatch + 6, rowY + swatch - 1);
  });

  // Identity
  const idY = y0 + pad + fontSize * 2.8 + items.length * lineH;
  ctx.fillStyle = "#8b949e";
  ctx.font = `${Math.round(fontSize * 0.85)}px sans-serif`;
  ctx.fillText(
    `Identity: ${meta.stats.identity_pct}%`,
    x0 + pad,
    idY + fontSize
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Tooltip on hover
// ─────────────────────────────────────────────────────────────────────────────

let tooltipLUT = null;  // inverse map: (gx, gy) → cell index

function buildTooltipLUT(order) {
  const n = 1 << order;
  // Map pixel → cell index via forward LUT
  tooltipLUT = { order, n, lut };
}

document.getElementById("main-canvas").addEventListener("mousemove", (e) => {
  if (!currentData || !lut) return;

  const canvas = document.getElementById("main-canvas");
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;

  const mx = (e.clientX - rect.left)  * scaleX;
  const my = (e.clientY - rect.top)   * scaleY;

  const order = parseInt(document.getElementById("order-select").value);
  const n     = 1 << order;
  const cellPx = canvas.width / n;

  const gx = Math.floor(mx / cellPx);
  const gy = Math.floor(my / cellPx);

  // Reverse-lookup: find cell index where lut[d*2]==gx && lut[d*2+1]==gy
  // For performance, do a scanline search only over likely range
  const total = n * n;
  const posLen = currentData.positions.length;
  const stride = Math.max(1, Math.ceil(posLen / total));

  // Binary scan isn't straightforward on Hilbert; just walk lut in O(n²) once
  // and cache. Use a reverse grid map.
  if (!canvas._revMap || canvas._revOrder !== order) {
    const revMap = new Int32Array(n * n).fill(-1);
    for (let d = 0; d < total; d++) {
      revMap[lut[d * 2 + 1] * n + lut[d * 2]] = d;
    }
    canvas._revMap   = revMap;
    canvas._revOrder = order;
  }

  const cell = canvas._revMap[gy * n + gx];
  if (cell < 0) return;

  const startPos = cell * stride;
  const endPos   = Math.min(startPos + stride, posLen);
  const sample   = currentData.positions[startPos];
  if (!sample) return;

  const tip = document.getElementById("tooltip");
  tip.innerHTML =
    `<strong>Position ${sample.pos.toLocaleString()}</strong><br>` +
    `${currentData.meta.species_a.name}: <code>${sample.a}</code><br>` +
    `${currentData.meta.species_b.name}: <code>${sample.b}</code><br>` +
    `Type: <span style="color:${typeColor(sample.type)}">${sample.type}</span>`;

  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top  = (e.clientY - 10) + "px";
  tip.classList.add("visible");
});

document.getElementById("main-canvas").addEventListener("mouseleave", () => {
  document.getElementById("tooltip").classList.remove("visible");
});

function typeColor(t) {
  if (t === "match")    return document.getElementById("match-color").value;
  if (t === "mismatch") return document.getElementById("mismatch-color").value;
  return document.getElementById("gap-color").value;
}

// ─────────────────────────────────────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────────────────────────────────────

function loadJSON(file) {
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      setProgress("Parsing JSON…");
      await yieldFrame();
      currentData = JSON.parse(e.target.result);
      validateData(currentData);
      applyColorsFromData(currentData);
      updateStats(currentData);
      document.getElementById("drop-zone").classList.add("hidden");
      document.getElementById("controls").style.display = "flex";
      document.title = `GenomeDiff — ${currentData.meta.label}`;
      document.getElementById("subtitle").textContent = currentData.meta.label;
      await render();
    } catch (err) {
      alert("Failed to load JSON: " + err.message);
      setProgress("");
    }
  };
  reader.readAsText(file);
}

function validateData(data) {
  if (!data.positions || !Array.isArray(data.positions)) {
    throw new Error("JSON must contain a 'positions' array.");
  }
  if (!data.meta) throw new Error("JSON must contain a 'meta' object.");
}

function applyColorsFromData(data) {
  if (data.colors) {
    if (data.colors.match)    document.getElementById("match-color").value    = data.colors.match;
    if (data.colors.mismatch) document.getElementById("mismatch-color").value = data.colors.mismatch;
    if (data.colors.gap)      document.getElementById("gap-color").value      = data.colors.gap;
  }
}

function updateStats(data) {
  const s = data.meta.stats;
  document.getElementById("stats").innerHTML =
    `<div class="stat-item">Alignment length: <strong>${data.meta.alignment_length.toLocaleString()} bp</strong></div>` +
    `<div class="stat-item">Match: <strong style="color:${data.colors?.match||'#2196F3'}">${s.match.toLocaleString()}</strong></div>` +
    `<div class="stat-item">Mismatch: <strong style="color:${data.colors?.mismatch||'#FF5722'}">${s.mismatch.toLocaleString()}</strong></div>` +
    `<div class="stat-item">Gap: <strong style="color:${data.colors?.gap||'#9E9E9E'}">${s.gap.toLocaleString()}</strong></div>` +
    `<div class="stat-item">Identity: <strong>${s.identity_pct}%</strong></div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// PNG export — full canvas resolution
// ─────────────────────────────────────────────────────────────────────────────

document.getElementById("export-btn").addEventListener("click", async () => {
  const canvas = document.getElementById("main-canvas");
  if (canvas.width === 0) return;

  setProgress("Preparing export…");
  await yieldFrame();

  const link = document.createElement("a");
  const label = (currentData?.meta?.pair_id || "genomediff").replace(/\s+/g, "_");
  link.download = `${label}_hilbert_${canvas.width}px.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  setProgress("");
});

// ─────────────────────────────────────────────────────────────────────────────
// Event wiring
// ─────────────────────────────────────────────────────────────────────────────

// Drop zone
const dropZone = document.getElementById("drop-zone");
dropZone.addEventListener("click", () => document.getElementById("file-input").click());
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file) loadJSON(file);
});

document.getElementById("file-input").addEventListener("change", (e) => {
  if (e.target.files[0]) loadJSON(e.target.files[0]);
});

document.getElementById("render-btn").addEventListener("click", render);

document.getElementById("load-btn").addEventListener("click", () => {
  document.getElementById("drop-zone").classList.remove("hidden");
  document.getElementById("controls").style.display = "none";
  document.getElementById("canvas-wrap").style.display = "none";
  document.getElementById("stats").innerHTML = "";
  currentData = null;
});

// Re-render when size/order changes
["order-select", "size-select"].forEach(id => {
  document.getElementById(id).addEventListener("change", render);
});

// ─────────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────────

function setProgress(msg) {
  document.getElementById("progress").textContent = msg;
}

function yieldFrame() {
  return new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
}
</script>
</body>
</html>
