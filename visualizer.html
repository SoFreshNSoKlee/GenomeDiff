<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenomeDiff — 3D Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'SF Mono', 'Consolas', 'Monaco', 'Lucida Console', monospace;
  }

  /* ── Drop zone ──────────────────────────────────────────────────────────── */
  #drop-zone {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 52px 72px;
    text-align: center;
    cursor: pointer;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition: border-color 0.25s, box-shadow 0.25s;
    user-select: none;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: rgba(0,170,255,0.55);
    box-shadow: 0 0 40px rgba(0,140,255,0.12);
  }
  #drop-zone h2 {
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-bottom: 16px;
  }
  #drop-zone p {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    line-height: 2;
  }
  #drop-zone strong { color: rgba(255,255,255,0.55); font-weight: 400; }
  #drop-zone.hidden { display: none; }

  /* ── HUD overlay ────────────────────────────────────────────────────────── */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  #hud.hidden { display: none; }

  #hud-title {
    position: absolute;
    top: 32px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
  }
  #hud-title strong {
    display: block;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
    margin-bottom: 5px;
  }
  #hud-title span {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.28);
    text-transform: uppercase;
  }

  #hud-stats {
    position: absolute;
    bottom: 36px; left: 36px;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    line-height: 2.1;
    text-transform: uppercase;
  }
  .stat-identity { color: rgba(255,255,255,0.55); }
  .stat-match    { color: rgba(0, 170, 255, 0.65); }
  .stat-mismatch { color: rgba(255, 90, 30,  0.75); }
  .stat-gap      { color: rgba(130, 60, 220, 0.6); }

  #hud-legend {
    position: absolute;
    bottom: 36px; right: 36px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
  .legend-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Hint (mouse instruction) ───────────────────────────────────────────── */
  #hint {
    position: absolute;
    bottom: 36px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    white-space: nowrap;
    transition: opacity 1s;
  }

  /* ── Load button ────────────────────────────────────────────────────────── */
  #load-btn {
    position: fixed;
    top: 26px; right: 30px;
    z-index: 100;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: rgba(255,255,255,0.3);
    padding: 7px 15px;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    pointer-events: all;
    display: none;
  }
  #load-btn:hover {
    border-color: rgba(0,170,255,0.45);
    color: rgba(0,170,255,0.8);
  }

  /* ── Progress ───────────────────────────────────────────────────────────── */
  #progress {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    display: none;
  }
</style>
</head>
<body>

<!-- Drop zone -->
<div id="drop-zone">
  <h2>GenomeDiff</h2>
  <p>Drop <strong>*.json</strong> here or click to browse<br>
     <span style="opacity:0.6">generated by fetch_align.py</span></p>
  <input type="file" id="file-input" accept=".json" style="display:none">
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-title">
    <strong id="hud-label">—</strong>
    <span id="hud-species">—</span>
  </div>
  <div id="hud-stats"></div>
  <div id="hud-legend">
    <div class="legend-item">
      <span>Match</span>
      <span class="legend-dot" style="background:#00aaff;box-shadow:0 0 7px #00aaff"></span>
    </div>
    <div class="legend-item">
      <span>Mismatch</span>
      <span class="legend-dot" style="background:#ff5520;box-shadow:0 0 7px #ff5520"></span>
    </div>
    <div class="legend-item">
      <span>Gap</span>
      <span class="legend-dot" style="background:#7733dd;box-shadow:0 0 5px #7733dd"></span>
    </div>
  </div>
  <div id="hint">move mouse to rotate &nbsp;·&nbsp; center to stop</div>
</div>

<button id="load-btn">Load file</button>
<div id="progress"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Three.js — renderer, scene, camera
// ─────────────────────────────────────────────────────────────────────────────

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.domElement.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;';
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 0, 3.0);

// All point clouds live inside this pivot so we rotate as one unit
const pivot = new THREE.Group();
pivot.rotation.x = -0.28;   // initial tilt to reveal 3D depth
scene.add(pivot);

// Subtle star-field background for depth context
(function buildStarField() {
  const N = 1800;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 8 + Math.random() * 12;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.03,
    transparent: true,
    opacity: 0.25,
    sizeAttenuation: true,
    depthWrite: false,
  });
  scene.add(new THREE.Points(geo, mat));
})();

// ─────────────────────────────────────────────────────────────────────────────
// Hilbert curve utilities
// ─────────────────────────────────────────────────────────────────────────────

function hilbertD2XY(order, d) {
  let x = 0, y = 0;
  for (let s = 1; s < (1 << order); s <<= 1) {
    const rx = (d >> 1) & 1;
    const ry = (d ^ rx) & 1;
    if (ry === 0) {
      if (rx === 1) { x = s - 1 - x; y = s - 1 - y; }
      [x, y] = [y, x];
    }
    x += s * rx;
    y += s * ry;
    d >>= 2;
  }
  return [x, y];
}

function buildHilbertLUT(order) {
  const n     = 1 << order;
  const total = n * n;
  const lut   = new Int32Array(total * 2);
  for (let d = 0; d < total; d++) {
    const [x, y] = hilbertD2XY(order, d);
    lut[d * 2]     = x;
    lut[d * 2 + 1] = y;
  }
  return lut;
}

// ─────────────────────────────────────────────────────────────────────────────
// Build & add point cloud from alignment data
// ─────────────────────────────────────────────────────────────────────────────

let clouds = [];

function disposeCloud(c) {
  if (!c) return;
  c.geometry.dispose();
  c.material.dispose();
  pivot.remove(c);
}

function buildPointCloud(data) {
  clouds.forEach(disposeCloud);
  clouds = [];

  const positions = data.positions;
  const posLen    = positions.length;

  const ORDER      = 7;          // 128×128 = 16 384 Hilbert cells
  const GRID_N     = 1 << ORDER;
  const TOTAL_CELLS = GRID_N * GRID_N;

  setProgress('Building Hilbert LUT…');
  const lut = buildHilbertLUT(ORDER);

  // --- count types for pre-allocation ---
  let nM = 0, nMM = 0, nG = 0;
  for (let i = 0; i < posLen; i++) {
    const t = positions[i].type;
    if (t === 'match') nM++;
    else if (t === 'mismatch') nMM++;
    else nG++;
  }

  const matchBuf    = new Float32Array(nM  * 3);
  const mismatchBuf = new Float32Array(nMM * 3);
  const gapBuf      = new Float32Array(nG  * 3);

  let mi = 0, mmi = 0, gi = 0;

  setProgress('Placing points in 3D…');

  // Seeded pseudo-random for deterministic jitter (fast, good enough)
  let seed = 0x9e3779b9;
  function rand() {
    seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5;
    return (seed >>> 0) / 0xffffffff;
  }

  for (let i = 0; i < posLen; i++) {
    const cellIdx = Math.min(Math.floor(i * TOTAL_CELLS / posLen), TOTAL_CELLS - 1);
    const gx = lut[cellIdx * 2];
    const gy = lut[cellIdx * 2 + 1];

    // Hilbert grid → [-1, 1]
    const nx = (gx / GRID_N) * 2.0 - 1.0;
    const ny = (gy / GRID_N) * 2.0 - 1.0;

    // Z: smooth wave terrain — reveals 3D depth on rotation
    const waveZ = 0.16 * Math.sin(nx * 3.6) * Math.cos(ny * 2.8)
                + 0.06 * Math.cos(nx * 7.0 + ny * 5.0);

    const type = positions[i].type;

    const SCALE = 1.28;

    if (type === 'match') {
      const jx = (rand() - 0.5) * 0.004;
      const jy = (rand() - 0.5) * 0.004;
      const jz = (rand() - 0.5) * 0.012;
      matchBuf[mi++] = nx * SCALE + jx;
      matchBuf[mi++] = ny * SCALE + jy;
      matchBuf[mi++] = waveZ + jz;
    } else if (type === 'mismatch') {
      const jx = (rand() - 0.5) * 0.010;
      const jy = (rand() - 0.5) * 0.010;
      const jz = (rand() - 0.5) * 0.018;
      mismatchBuf[mmi++] = nx * SCALE + jx;
      mismatchBuf[mmi++] = ny * SCALE + jy;
      mismatchBuf[mmi++] = waveZ + jz + 0.10;   // float above the match plane
    } else {
      const jx = (rand() - 0.5) * 0.004;
      const jy = (rand() - 0.5) * 0.004;
      const jz = (rand() - 0.5) * 0.010;
      gapBuf[gi++] = nx * SCALE + jx;
      gapBuf[gi++] = ny * SCALE + jy;
      gapBuf[gi++] = waveZ + jz - 0.05;          // slightly behind
    }
  }

  // Helper: build a THREE.Points object
  function makeCloud(buf, hexColor, size, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(buf, 3));
    const mat = new THREE.PointsMaterial({
      color:        hexColor,
      size:         size,
      transparent:  true,
      opacity:      opacity,
      blending:     THREE.AdditiveBlending,
      depthWrite:   false,
      sizeAttenuation: true,
    });
    return new THREE.Points(geo, mat);
  }

  // Match  — electric blue,  small, medium opacity → dense glow
  const cMatch    = makeCloud(matchBuf,    0x0099ff, 0.0075, 0.70);
  // Mismatch — hot orange,   larger → visually pops
  const cMismatch = makeCloud(mismatchBuf, 0xff4400, 0.0170, 1.00);
  // Gap      — deep violet,  tiny, subtle
  const cGap      = makeCloud(gapBuf,      0x7722ee, 0.0060, 0.55);

  pivot.add(cMatch);
  pivot.add(cMismatch);
  pivot.add(cGap);
  clouds = [cMatch, cMismatch, cGap];

  setProgress('');
}

// ─────────────────────────────────────────────────────────────────────────────
// Mouse-driven rotation
// ─────────────────────────────────────────────────────────────────────────────

let mouseNX = 0, mouseNY = 0;  // normalized [-1, 1] from window center
let velX    = 0, velY    = 0;  // current angular velocity (radians/frame)

document.addEventListener('mousemove', (e) => {
  mouseNX = (e.clientX / window.innerWidth  - 0.5) * 2.0;
  mouseNY = (e.clientY / window.innerHeight - 0.5) * 2.0;
});

// Dead-zone radius so the very center truly stops spinning
const DEAD_ZONE  = 0.06;
const MAX_SPEED  = 0.028;   // rad/frame at mouse edge (~100°/sec at 60fps)
const LERP_ACCEL = 0.055;   // how quickly velocity tracks the mouse

// ─────────────────────────────────────────────────────────────────────────────
// Render loop
// ─────────────────────────────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);

  if (clouds.length > 0) {
    // Dead-zone: if mouse is very close to center, target velocity is 0
    const dist = Math.sqrt(mouseNX * mouseNX + mouseNY * mouseNY);
    const factor = dist < DEAD_ZONE ? 0 : (dist - DEAD_ZONE) / (1 - DEAD_ZONE);

    const targetY = (mouseNX / Math.max(dist, 0.001)) * factor * MAX_SPEED;
    const targetX = (mouseNY / Math.max(dist, 0.001)) * factor * MAX_SPEED;

    velY += (targetY - velY) * LERP_ACCEL;
    velX += (targetX - velX) * LERP_ACCEL;

    pivot.rotation.y += velY;
    pivot.rotation.x += velX;
  }

  renderer.render(scene, camera);
}

animate();

// ─────────────────────────────────────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────────────────────────────────────

function loadJSON(file) {
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      setProgress('Parsing JSON…');
      await yieldFrame();

      const data = JSON.parse(e.target.result);
      if (!data.positions || !Array.isArray(data.positions) || !data.meta) {
        throw new Error("JSON must contain 'positions' array and 'meta' object.");
      }

      buildPointCloud(data);

      // Populate HUD
      const s = data.meta.stats;
      document.getElementById('hud-label').textContent =
        data.meta.label || (data.meta.pair_id || 'Genome Diff');
      document.getElementById('hud-species').textContent =
        `${data.meta.species_a.name}  ×  ${data.meta.species_b.name}`;

      document.getElementById('hud-stats').innerHTML =
        `<div class="stat-identity">${s.identity_pct}%&nbsp;&nbsp;identity</div>` +
        `<div class="stat-match">▪ ${s.match.toLocaleString()}&nbsp;&nbsp;match</div>` +
        `<div class="stat-mismatch">▪ ${s.mismatch.toLocaleString()}&nbsp;&nbsp;mismatch</div>` +
        `<div class="stat-gap">▪ ${s.gap.toLocaleString()}&nbsp;&nbsp;gap</div>`;

      document.getElementById('drop-zone').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('load-btn').style.display = 'block';
      document.title = `GenomeDiff — ${data.meta.label || ''}`;

      // Fade hint out after 5s
      const hint = document.getElementById('hint');
      setTimeout(() => { hint.style.opacity = '0'; }, 5000);

    } catch (err) {
      setProgress('');
      alert('Failed to load: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ─────────────────────────────────────────────────────────────────────────────
// Event wiring
// ─────────────────────────────────────────────────────────────────────────────

const dropZone = document.getElementById('drop-zone');

dropZone.addEventListener('click',    () => document.getElementById('file-input').click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadJSON(f);
});

document.getElementById('file-input').addEventListener('change', (e) => {
  if (e.target.files[0]) loadJSON(e.target.files[0]);
});

document.getElementById('load-btn').addEventListener('click', () => {
  clouds.forEach(disposeCloud);
  clouds = [];
  velX = velY = 0;
  pivot.rotation.set(-0.28, 0, 0);
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('load-btn').style.display = 'none';
  document.getElementById('hint').style.opacity = '1';
});

// ─────────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────────

function setProgress(msg) {
  const el = document.getElementById('progress');
  el.textContent  = msg;
  el.style.display = msg ? 'block' : 'none';
}

function yieldFrame() {
  return new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
}
</script>
</body>
</html>
